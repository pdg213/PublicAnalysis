<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAMSec Document Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .page { max-width: 560px; margin: 0 auto; }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
        h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #cbd5e1; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        label {
            display: block; font-size: 13px; font-weight: 500;
            color: #94a3b8; margin-bottom: 6px; margin-top: 16px;
        }
        input[type="text"], input[type="email"], input[type="password"],
        input[type="number"], input[type="date"] {
            width: 100%; padding: 10px 14px;
            border: 1px solid #334155; border-radius: 8px;
            background: #0f172a; color: #e2e8f0; font-size: 15px;
            outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: #3b82f6; }
        input::placeholder { color: #475569; }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }
        .section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #334155; }
        /* Checkboxes */
        .checkbox-group { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
        .checkbox-item {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; font-size: 14px; color: #cbd5e1;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: #3b82f6; cursor: pointer;
        }
        /* Buttons */
        .btn {
            width: 100%; margin-top: 24px; padding: 12px;
            border: none; border-radius: 8px; font-size: 15px;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn:disabled { background: #334155; cursor: not-allowed; color: #64748b; }
        /* Credential banner */
        .cred-banner {
            background: #052e16; border: 1px solid #166534; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 16px; font-size: 14px; color: #86efac;
            display: flex; justify-content: space-between; align-items: center;
        }
        .cred-banner button {
            background: none; border: 1px solid #166534; color: #86efac;
            padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .cred-banner button:hover { background: #166534; }
        /* Status / Progress */
        #status {
            margin-top: 20px; padding: 14px; border-radius: 8px;
            font-size: 13px; display: none; line-height: 1.8;
            max-height: 300px; overflow-y: auto;
        }
        #status.running {
            display: block; background: #172554; border: 1px solid #1e40af; color: #93c5fd;
        }
        #status.success {
            display: block; background: #052e16; border: 1px solid #166534; color: #86efac;
        }
        #status.error {
            display: block; background: #450a0a; border: 1px solid #991b1b; color: #fca5a5;
        }
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid #93c5fd; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-line { padding: 2px 0; }
        .progress-line:last-child { font-weight: 600; }
        .download-btn {
            display: inline-block; margin-top: 12px; padding: 8px 20px;
            background: #16a34a; color: white; border: none; border-radius: 6px;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
        }
        .download-btn:hover { background: #15803d; }
        /* History */
        .history-item {
            padding: 10px 0; border-bottom: 1px solid #334155;
            font-size: 13px; color: #94a3b8;
        }
        .history-item:last-child { border-bottom: none; }
        .history-tickers { color: #e2e8f0; font-weight: 600; }
        .history-meta { color: #64748b; font-size: 12px; margin-top: 2px; }
        .empty-history { color: #475569; font-size: 14px; font-style: italic; }
        .note {
            margin-top: 16px; font-size: 12px; color: #64748b; text-align: center;
        }
        .collapsible-header {
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .collapsible-header .arrow { transition: transform 0.2s; font-size: 12px; color: #64748b; }
        .collapsible-header .arrow.open { transform: rotate(180deg); }
        .collapsible-content { display: none; }
        .collapsible-content.open { display: block; }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>BAMSec Document Downloader</h1>
            <p class="subtitle">Download earnings transcripts and financial filings as PDFs</p>

            <form id="downloadForm">
                <!-- Credential section -->
                <div id="credBanner" style="display:none;" class="cred-banner">
                    <span>Logged in as <strong id="credEmail"></strong></span>
                    <button type="button" onclick="clearCredentials()">Change Account</button>
                </div>

                <div id="credFields">
                    <label for="email">BAMSec Email</label>
                    <input type="email" id="email" placeholder="you@example.com">

                    <label for="password">BAMSec Password</label>
                    <input type="password" id="password" placeholder="Your BAMSec password">
                </div>

                <!-- Tickers -->
                <div class="section">
                    <label for="tickers">Stock Tickers (comma-separated for multiple)</label>
                    <input type="text" id="tickers" placeholder="e.g. RH, AAPL, MSFT"
                           style="text-transform: uppercase;" required>
                </div>

                <!-- Document Types -->
                <div class="section">
                    <label>What to Download</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" id="transcripts" checked>
                            Earnings Transcripts
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="financials">
                            Financial Filings
                        </label>
                    </div>
                </div>

                <!-- Transcript options -->
                <div id="transcriptOptions">
                    <div class="row" style="margin-top: 12px;">
                        <div>
                            <label for="transcriptCount">Transcripts per ticker</label>
                            <input type="number" id="transcriptCount" value="8" min="1" max="20">
                        </div>
                        <div></div>
                    </div>
                </div>

                <!-- Financial options -->
                <div id="financialOptions" style="display:none;">
                    <div class="row" style="margin-top: 12px;">
                        <div>
                            <label for="financialCount">Filings per ticker</label>
                            <input type="number" id="financialCount" value="8" min="1" max="20">
                        </div>
                        <div>
                            <label>Filing types</label>
                            <div class="checkbox-group" style="margin-top: 8px;">
                                <label class="checkbox-item">
                                    <input type="checkbox" id="filing10Q" checked> 10-Q
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" id="filing10K" checked> 10-K
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Advanced: Date Range (collapsible) -->
                <div class="section">
                    <div class="collapsible-header" onclick="toggleAdvanced()">
                        <label style="margin:0; cursor:pointer;">Advanced Filters</label>
                        <span class="arrow" id="advancedArrow">&#9660;</span>
                    </div>
                    <div class="collapsible-content" id="advancedContent">
                        <div class="row" style="margin-top: 12px;">
                            <div>
                                <label for="dateFrom">From date</label>
                                <input type="date" id="dateFrom">
                            </div>
                            <div>
                                <label for="dateTo">To date</label>
                                <input type="date" id="dateTo">
                            </div>
                        </div>
                        <p style="font-size: 12px; color: #64748b; margin-top: 6px;">
                            Filters financial filings by filing date. Leave blank for no limit.
                        </p>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">Download</button>
            </form>

            <div id="status"></div>

            <p class="note">Your credentials are cached for 6 hours and never saved permanently.</p>
        </div>

        <!-- Download History -->
        <div class="card">
            <h2>Download History</h2>
            <div id="historyList"><p class="empty-history">No downloads yet.</p></div>
        </div>
    </div>

    <script>
        // --- State ---
        let credToken = localStorage.getItem('bamsec_cred_token') || '';

        // --- Init ---
        window.addEventListener('DOMContentLoaded', () => {
            checkCredentials();
            loadHistory();
            updateVisibility();
        });

        // --- Credential Management ---
        async function checkCredentials() {
            if (!credToken) return;
            try {
                const res = await fetch('/check-credentials', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cred_token: credToken })
                });
                const data = await res.json();
                if (data.valid) {
                    document.getElementById('credBanner').style.display = 'flex';
                    document.getElementById('credEmail').textContent = data.email;
                    document.getElementById('credFields').style.display = 'none';
                } else {
                    clearCredentials();
                }
            } catch {
                clearCredentials();
            }
        }

        function clearCredentials() {
            credToken = '';
            localStorage.removeItem('bamsec_cred_token');
            document.getElementById('credBanner').style.display = 'none';
            document.getElementById('credFields').style.display = 'block';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // --- Visibility toggles ---
        function updateVisibility() {
            document.getElementById('transcriptOptions').style.display =
                document.getElementById('transcripts').checked ? 'block' : 'none';
            document.getElementById('financialOptions').style.display =
                document.getElementById('financials').checked ? 'block' : 'none';
        }
        document.getElementById('transcripts').addEventListener('change', updateVisibility);
        document.getElementById('financials').addEventListener('change', updateVisibility);

        function toggleAdvanced() {
            const content = document.getElementById('advancedContent');
            const arrow = document.getElementById('advancedArrow');
            content.classList.toggle('open');
            arrow.classList.toggle('open');
        }

        // --- Form Submit ---
        const form = document.getElementById('downloadForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const tickers = document.getElementById('tickers').value.toUpperCase();
            const transcripts = document.getElementById('transcripts').checked;
            const financials = document.getElementById('financials').checked;
            const transcriptCount = parseInt(document.getElementById('transcriptCount').value) || 8;
            const financialCount = parseInt(document.getElementById('financialCount').value) || 8;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            // Filing types
            const filingTypes = [];
            if (document.getElementById('filing10Q').checked) filingTypes.push('10-Q');
            if (document.getElementById('filing10K').checked) filingTypes.push('10-K');

            if (!tickers) { alert('Please enter at least one ticker.'); return; }
            if (!transcripts && !financials) { alert('Please select Transcripts and/or Financials.'); return; }
            if (!credToken && (!email || !password)) { alert('Please enter your BAMSec credentials.'); return; }

            // Disable form
            submitBtn.disabled = true;
            submitBtn.textContent = 'Working...';
            status.className = 'running';
            status.innerHTML = '<span class="spinner"></span>Starting...';

            try {
                // Start the job
                const startRes = await fetch('/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email, password, cred_token: credToken,
                        tickers, transcripts, financials,
                        transcript_count: transcriptCount,
                        financial_count: financialCount,
                        filing_types: filingTypes,
                        date_from: dateFrom, date_to: dateTo,
                    })
                });

                const startData = await startRes.json();
                if (!startRes.ok) {
                    status.className = 'error';
                    status.textContent = startData.error || 'Failed to start download.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Download';
                    return;
                }

                // Save credential token
                credToken = startData.cred_token;
                localStorage.setItem('bamsec_cred_token', credToken);

                // Listen to progress via SSE
                const jobId = startData.job_id;
                const evtSource = new EventSource(`/progress/${jobId}`);
                let lines = [];

                evtSource.onmessage = (event) => {
                    const msg = JSON.parse(event.data);

                    if (msg.type === 'progress') {
                        lines.push(msg.message);
                        // Keep last 20 lines visible
                        const visible = lines.slice(-20);
                        status.innerHTML = '<span class="spinner"></span>' +
                            visible.map(l => `<div class="progress-line">${escapeHtml(l)}</div>`).join('');
                        status.scrollTop = status.scrollHeight;
                    }

                    if (msg.type === 'error') {
                        status.className = 'error';
                        status.textContent = msg.message;
                        evtSource.close();
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Download';
                    }

                    if (msg.type === 'done') {
                        evtSource.close();
                        // Check if we have files to download
                        status.className = 'success';
                        status.innerHTML = lines.filter(l => l.startsWith('Done')).map(l =>
                            `<div>${escapeHtml(l)}</div>`
                        ).join('') || '<div>Complete!</div>';
                        status.innerHTML += `<a href="/download/${jobId}" class="download-btn">Save ZIP File</a>`;
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Download';
                        checkCredentials();
                        loadHistory();
                    }
                };

                evtSource.onerror = () => {
                    evtSource.close();
                    if (status.className === 'running') {
                        status.className = 'error';
                        status.textContent = 'Lost connection to server. Try again.';
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Download';
                };

            } catch (err) {
                status.className = 'error';
                status.textContent = 'Could not connect to the server. Make sure it is running.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Download';
            }
        });

        // --- History ---
        async function loadHistory() {
            try {
                const res = await fetch('/history');
                const history = await res.json();
                const list = document.getElementById('historyList');

                if (!history.length) {
                    list.innerHTML = '<p class="empty-history">No downloads yet.</p>';
                    return;
                }

                list.innerHTML = history.map(h => {
                    const date = new Date(h.timestamp).toLocaleString();
                    const tickers = h.tickers.join(', ');
                    const types = [];
                    if (h.transcripts) types.push(`${h.transcript_count} transcripts`);
                    if (h.financials) types.push(`${h.financial_count} financials`);
                    return `<div class="history-item">
                        <span class="history-tickers">${escapeHtml(tickers)}</span>
                        — ${types.join(' + ')} — ${h.file_count} files
                        <div class="history-meta">${date}</div>
                    </div>`;
                }).join('');
            } catch { /* ignore */ }
        }

        // --- Util ---
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
